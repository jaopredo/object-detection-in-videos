[project]
name = "object-detection-in-videos"
version = "0.1.0"
description = "PA2 — Identidade ao longo do tempo: detecção, recorrência e rastreamento"
readme = "README.md"
authors = [
    { name = "jaopredo", email = "joao.profissional.45@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
