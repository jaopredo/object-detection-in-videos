    # o entregável notebooks/inferencia.ipynb precisa de um kernel para abrir
    "ipykernel>=6.29",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pytest>=8.0",
    "pyyaml>=6.0",
    "scikit-image>=0.22",
    "scipy>=1.11",
    "tqdm>=4.66",
]
